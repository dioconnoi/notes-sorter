[project]
name = "notes-sorter"
version = "0.1.0"
description = "LLM agent that sorts scattered notes into Notion, tracks todos with Eisenhower/GTD priority, and reports via Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-telegram-bot>=21.0",
    "notion-client>=2.2.1",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "gkeepapi>=0.15.1",
    "google-api-python-client>=2.140.0",
    "google-auth-oauthlib>=1.2.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
notes-sorter = "notes_sorter.main:cli"
notes-sorter-setup = "notes_sorter.setup_wizard:main"
notes-sorter-provision = "scripts.provision_notion:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
